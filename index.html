<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>網站負載測試工具</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #f4f6f8;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
    background: #fff;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    margin-top: 20px;
    padding: 12px 20px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

#start {
    background: #222;
    color: white;
}

#stop {
    background: #ddd;
    margin-left: 8px;
}

.stats {
    margin-top: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 10px;
    line-height: 2;
}

.progress {
    margin-top: 20px;
    width: 100%;
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progressBar {
    height: 100%;
    width: 0%;
    background: #222;
    transition: width .1s;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>網站負載測試工具</h2>

<label>測試網址</label>
<input
    id="url"
    type="url"
    placeholder="https://example.com"
>

<label>最大請求數</label>
<input
    id="maxRequests"
    type="number"
    min="1"
    max="10000"
    value="1000"
>

<label>測試時間（秒）</label>
<input
    id="duration"
    type="number"
    min="1"
    max="300"
    value="30"
>

<label>併發數</label>
<input
    id="concurrency"
    type="number"
    min="1"
    max="50"
    value="10"
>

<label>每批間隔（毫秒）</label>
<input
    id="interval"
    type="number"
    min="0"
    max="10000"
    value="100"
>

<br>

<button id="start" onclick="startTest()">
開始測試
</button>

<button id="stop" onclick="stopTest()">
停止測試
</button>

<div class="progress">
    <div id="progressBar" class="progressBar"></div>
</div>

<div class="stats">

    <div>
        已發送：
        <span id="sent">0</span>
    </div>

    <div>
        成功：
        <span id="success">0</span>
    </div>

    <div>
        失敗：
        <span id="failed">0</span>
    </div>

    <div>
        RPS：
        <span id="rps">0</span>
    </div>

    <div>
        剩餘時間：
        <span id="remaining">0</span> 秒
    </div>

</div>

<div id="status">
    尚未開始
</div>

</div>

<script>

let running = false;

let sent = 0;
let success = 0;
let failed = 0;

let startTime = 0;
let endTime = 0;

async function startTest() {

    if (running) return;

    const url =
        document.getElementById("url").value.trim();

    const maxRequests =
        Number(document.getElementById("maxRequests").value);

    const duration =
        Number(document.getElementById("duration").value);

    const concurrency =
        Number(document.getElementById("concurrency").value);

    const interval =
        Number(document.getElementById("interval").value);

    if (!url) {
        alert("請輸入測試網址");
        return;
    }

    if (
        maxRequests <= 0 ||
        duration <= 0 ||
        concurrency <= 0 ||
        interval < 0
    ) {
        alert("請確認測試參數");
        return;
    }

    running = true;

    sent = 0;
    success = 0;
    failed = 0;

    startTime = Date.now();

    endTime =
        startTime +
        duration * 1000;

    document.getElementById("status").textContent =
        "測試進行中...";

    updateUI();

    while (
        running &&
        sent < maxRequests &&
        Date.now() < endTime
    ) {

        const batchSize =
            Math.min(
                concurrency,
                maxRequests - sent
            );

        const requests = [];

        for (let i = 0; i < batchSize; i++) {

            requests.push(sendRequest(url));

        }

        await Promise.all(requests);

        updateUI();

        if (!running) break;

        if (interval > 0) {

            await sleep(interval);

        }
    }

    running = false;

    updateUI();

    document.getElementById("status").textContent =
        "測試完成";
}


async function sendRequest(url) {

    if (!running) return;

    sent++;

    try {

        const response =
            await fetch(url, {
                method: "GET",
                cache: "no-store"
            });

        if (response.ok) {

            success++;

        } else {

            failed++;

        }

    } catch (error) {

        failed++;

    }
}


function stopTest() {

    if (!running) return;

    running = false;

    document.getElementById("status").textContent =
        "已停止測試";

    updateUI();
}


function sleep(ms) {

    return new Promise(resolve => {

        setTimeout(resolve, ms);

    });

}


function updateUI() {

    const elapsed =
        Math.max(
            0.001,
            (Date.now() - startTime) / 1000
        );

    const remaining =
        Math.max(
            0,
            (endTime - Date.now()) / 1000
        );

    const rps =
        sent / elapsed;

    const maxRequests =
        Number(
            document.getElementById("maxRequests").value
        );

    const progress =
        Math.min(
            100,
            (sent / maxRequests) * 100
        );

    document.getElementById("sent").textContent =
        sent;

    document.getElementById("success").textContent =
        success;

    document.getElementById("failed").textContent =
        failed;

    document.getElementById("rps").textContent =
        rps.toFixed(2);

    document.getElementById("remaining").textContent =
        remaining.toFixed(1);

    document.getElementById("progressBar").style.width =
        progress + "%";
}

</script>

</body>
</html>
