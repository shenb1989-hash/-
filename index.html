<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網站公開資訊檢測器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #f5f7fa;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

.input-box {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

input {
    flex: 1;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    padding: 13px 20px;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.card {
    background: white;
    padding: 20px;
    margin-top: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

.item {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    word-break: break-all;
}

.error {
    color: #c62828;
}

.success {
    color: #2e7d32;
}
</style>
</head>

<body>

<div class="container">

<h1>網站公開資訊檢測器</h1>

<div class="input-box">
    <input
        id="url"
        type="url"
        placeholder="https://example.edu.tw"
    >

    <button onclick="scanWebsite()">
        開始檢測
    </button>
</div>

<div id="result"></div>

</div>

<script>

/*
 * AllOrigins Raw Content API
 *
 * 所有 fetch 都統一使用：
 *
 * CORS_PROXY + encodeURIComponent(url)
 *
 * 例如：
 * https://api.allorigins.win/raw?url=https%3A%2F%2Fexample.com
 */
const CORS_PROXY = "https://api.allorigins.win/raw?url=";


/*
 * 透過 AllOrigins 取得網站內容
 */
async function fetchText(url) {

    const response = await fetch(
        CORS_PROXY + encodeURIComponent(url),
        {
            method: "GET"
        }
    );

    if (!response.ok) {
        throw new Error(
            `HTTP ${response.status}（透過 Proxy 請求失敗）`
        );
    }

    return {
        response,
        text: await response.text()
    };
}


/*
 * 標準化 URL
 */
function normalizeUrl(url) {

    url = url.trim();

    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }

    return new URL(url);
}


/*
 * 擷取公開頁面連結
 */
function extractLinks(document, baseUrl) {

    const links = new Set();

    document.querySelectorAll("a[href]").forEach(a => {

        try {

            const url = new URL(
                a.getAttribute("href"),
                baseUrl
            );

            links.add(url.href);

        } catch {
            // 忽略無效 URL
        }

    });

    return [...links];
}


/*
 * 擷取公開 JavaScript
 */
function extractScripts(document, baseUrl) {

    const scripts = new Set();

    document.querySelectorAll("script[src]").forEach(script => {

        try {

            const url = new URL(
                script.getAttribute("src"),
                baseUrl
            );

            scripts.add(url.href);

        } catch {
            // 忽略無效 URL
        }

    });

    return [...scripts];
}


/*
 * 從 HTML 原始內容尋找疑似公開 Endpoint
 *
 * 注意：
 * 這只是「字串偵測」，
 * 不代表該 Endpoint 一定存在或可以存取。
 */
function extractPublicEndpoints(text) {

    const endpoints = new Set();

    const patterns = [

        /https?:\/\/[^\s"'<>()[\]]+/gi,

        /\/api\/[A-Za-z0-9_?&=./%-]+/gi,

        /\/graphql(?:\/[A-Za-z0-9_?&=./%-]*)?/gi,

        /\/v[0-9]+\/[A-Za-z0-9_?&=./%-]+/gi

    ];

    for (const pattern of patterns) {

        const matches = text.match(pattern) || [];

        matches.forEach(match => {

            /*
             * 排除 Proxy 本身
             */
            if (
                !match.includes("api.allorigins.win")
            ) {
                endpoints.add(match);
            }

        });
    }

    return [...endpoints];
}


/*
 * HTML Escape
 */
function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
}


/*
 * 渲染列表
 */
function renderList(items) {

    if (!items.length) {

        return `
            <div class="item">
                沒有找到公開項目
            </div>
        `;
    }

    return items
        .map(item => `
            <div class="item">
                ${escapeHtml(item)}
            </div>
        `)
        .join("");
}


/*
 * 檢查 robots.txt
 */
async function checkRobots(target) {

    const robotsUrl =
        new URL(
            "/robots.txt",
            target.origin
        ).href;

    try {

        const response = await fetch(
            CORS_PROXY + encodeURIComponent(robotsUrl),
            {
                method: "GET"
            }
        );

        const text = await response.text();

        if (
            response.ok &&
            text.trim() &&
            !/^<!doctype html/i.test(text.trim()) &&
            !/^<html/i.test(text.trim())
        ) {

            return {
                url: robotsUrl,
                status: `HTTP ${response.status}（讀取成功）`
            };

        }

        return {
            url: robotsUrl,
            status: `HTTP ${response.status}（可能不存在或回傳錯誤頁面）`
        };

    } catch {

        return {
            url: robotsUrl,
            status: "無法讀取"
        };
    }
}


/*
 * 檢查 sitemap.xml
 */
async function checkSitemap(target) {

    const sitemapUrl =
        new URL(
            "/sitemap.xml",
            target.origin
        ).href;

    try {

        const response = await fetch(
            CORS_PROXY + encodeURIComponent(sitemapUrl),
            {
                method: "GET"
            }
        );

        const text = await response.text();

        if (
            response.ok &&
            text.trim() &&
            !/^<!doctype html/i.test(text.trim()) &&
            !/^<html/i.test(text.trim())
        ) {

            return {
                url: sitemapUrl,
                status: `HTTP ${response.status}（讀取成功）`
            };

        }

        return {
            url: sitemapUrl,
            status: `HTTP ${response.status}（可能不存在或回傳錯誤頁面）`
        };

    } catch {

        return {
            url: sitemapUrl,
            status: "無法讀取"
        };
    }
}


/*
 * 主檢測流程
 */
async function scanWebsite() {

    const result =
        document.getElementById("result");

    const input =
        document.getElementById("url").value;


    /*
     * 檢查輸入
     */
    if (!input.trim()) {

        result.innerHTML = `
            <div class="card error">
                請輸入網站 URL
            </div>
        `;

        return;
    }


    /*
     * 標準化 URL
     */
    let target;

    try {

        target = normalizeUrl(input);

    } catch {

        result.innerHTML = `
            <div class="card error">
                URL 格式錯誤
            </div>
        `;

        return;
    }


    /*
     * 顯示載入狀態
     */
    result.innerHTML = `
        <div class="card">
            正在檢測（透過 AllOrigins Proxy）：
            <br>
            <strong>
                ${escapeHtml(target.href)}
            </strong>
        </div>
    `;


    try {

        /*
         * 取得網站 HTML
         */
        const {
            response,
            text
        } = await fetchText(target.href);


        /*
         * 解析 HTML
         */
        const parser = new DOMParser();

        const parsedDocument =
            parser.parseFromString(
                text,
                "text/html"
            );


        /*
         * 擷取公開資訊
         */
        const links =
            extractLinks(
                parsedDocument,
                target.href
            );

        const scripts =
            extractScripts(
                parsedDocument,
                target.href
            );

        const endpoints =
            extractPublicEndpoints(text);


        /*
         * 檢查 robots.txt 與 sitemap.xml
         */
        const robots =
            await checkRobots(target);

        const sitemap =
            await checkSitemap(target);


        /*
         * 顯示結果
         */
        result.innerHTML = `

            <div class="card">

                <h2>基本資訊</h2>

                <div class="item">
                    輸入 URL：
                    ${escapeHtml(input)}
                </div>

                <div class="item">
                    標準化 URL：
                    ${escapeHtml(target.href)}
                </div>

                <div class="item">
                    Origin：
                    ${escapeHtml(target.origin)}
                </div>

                <div class="item">
                    HTTP Status：
                    ${response.status}
                </div>

            </div>


            <div class="card">

                <h2>robots.txt</h2>

                <div class="item">
                    ${escapeHtml(robots.url)}
                </div>

                <div class="item">
                    ${escapeHtml(robots.status)}
                </div>

            </div>


            <div class="card">

                <h2>sitemap.xml</h2>

                <div class="item">
                    ${escapeHtml(sitemap.url)}
                </div>

                <div class="item">
                    ${escapeHtml(sitemap.status)}
                </div>

            </div>


            <div class="card">

                <h2>
                    公開頁面連結
                    (${links.length})
                </h2>

                ${renderList(links)}

            </div>


            <div class="card">

                <h2>
                    公開 JavaScript
                    (${scripts.length})
                </h2>

                ${renderList(scripts)}

            </div>


            <div class="card">

                <h2>
                    疑似公開 Endpoint
                    (${endpoints.length})
                </h2>

                ${renderList(endpoints)}

            </div>

        `;

    } catch (error) {

        result.innerHTML = `

            <div class="card error">

                <h2>
                    檢測失敗
                </h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

                <p>
                    常見原因：目標網站無法由 Proxy 取得、
                    Proxy 暫時無法使用、網路連線問題，
                    或網址輸入錯誤。
                </p>

            </div>

        `;
    }
}

</script>

</body>
</html>
