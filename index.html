<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網站資訊爬取工具</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 15px;
    background: #f4f6f8;
    font-family: Arial, "Noto Sans TC", sans-serif;
    color: #222;
}

.container {
    max-width: 1100px;
    margin: auto;
}

h1 {
    text-align: center;
}

.search {
    display: flex;
    gap: 10px;
    margin: 25px 0;
}

input {
    flex: 1;
    padding: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    padding: 14px 25px;
    border: 0;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.card {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 10px;
    box-shadow: 0 3px 12px #0001;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 10px;
}

.item {
    padding: 12px;
    background: #f3f4f6;
    border-radius: 7px;
    word-break: break-all;
}

pre {
    background: #111827;
    color: #e5e7eb;
    padding: 15px;
    border-radius: 8px;
    overflow: auto;
    max-height: 600px;
    white-space: pre-wrap;
    word-break: break-word;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th,
td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: left;
    word-break: break-all;
}

.status {
    padding: 15px;
    border-radius: 8px;
    background: #eef2ff;
}

.error {
    background: #fee2e2;
    color: #991b1b;
}

@media (max-width: 600px) {
    .search {
        flex-direction: column;
    }

    button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>網站資訊爬取工具</h1>

<div class="search">

<input
    id="url"
    type="url"
    placeholder="輸入 https://example.com"
>

<button onclick="scan()">
    開始爬取
</button>

</div>

<div id="result"></div>

</div>

<script>

async function scan() {

    const url = document.getElementById("url").value.trim();
    const result = document.getElementById("result");

    if (!url) {
        result.innerHTML = `
            <div class="card error">
                請輸入網址
            </div>
        `;
        return;
    }

    result.innerHTML = `
        <div class="card status">
            正在取得網站資料...
        </div>
    `;

    try {

        const response = await fetch(
            "https://api.allorigins.win/raw?url=" +
            encodeURIComponent(url)
        );

        if (!response.ok) {
            throw new Error("無法取得網站");
        }

        const html = await response.text();

        const parser = new DOMParser();

        const doc = parser.parseFromString(
            html,
            "text/html"
        );

        const title =
            doc.querySelector("title")?.innerText || "";

        const description =
            doc.querySelector(
                'meta[name="description"]'
            )?.content || "";

        const keywords =
            doc.querySelector(
                'meta[name="keywords"]'
            )?.content || "";

        const links = [
            ...doc.querySelectorAll("a")
        ].map(a => ({
            text: a.innerText.trim(),
            href: a.href
        }));

        const images = [
            ...doc.querySelectorAll("img")
        ].map(img => ({
            src: img.src,
            alt: img.alt
        }));

        const scripts = [
            ...doc.querySelectorAll("script[src]")
        ].map(script => script.src);

        const styles = [
            ...doc.querySelectorAll(
                'link[rel="stylesheet"]'
            )
        ].map(link => link.href);

        const headings = [
            ...doc.querySelectorAll(
                "h1,h2,h3,h4,h5,h6"
            )
        ].map(h => ({
            tag: h.tagName,
            text: h.innerText.trim()
        }));

        const text =
            doc.body?.innerText || "";

        result.innerHTML = `

        <div class="card">

            <h2>基本資訊</h2>

            <div class="grid">

                <div class="item">
                    <b>Title</b><br>
                    ${escapeHTML(title)}
                </div>

                <div class="item">
                    <b>Description</b><br>
                    ${escapeHTML(description)}
                </div>

                <div class="item">
                    <b>Keywords</b><br>
                    ${escapeHTML(keywords)}
                </div>

                <div class="item">
                    <b>HTML 大小</b><br>
                    ${formatBytes(
                        new Blob([html]).size
                    )}
                </div>

                <div class="item">
                    <b>文字長度</b><br>
                    ${text.length}
                </div>

                <div class="item">
                    <b>連結數量</b><br>
                    ${links.length}
                </div>

                <div class="item">
                    <b>圖片數量</b><br>
                    ${images.length}
                </div>

                <div class="item">
                    <b>JavaScript 數量</b><br>
                    ${scripts.length}
                </div>

            </div>

        </div>


        <div class="card">

            <h2>標題結構</h2>

            ${headings.length
                ? headings.map(h => `
                    <p>
                        <b>${h.tag}</b>
                        ${escapeHTML(h.text)}
                    </p>
                `).join("")
                : "沒有找到標題"
            }

        </div>


        <div class="card">

            <h2>公開連結</h2>

            <table>

                <tr>
                    <th>文字</th>
                    <th>URL</th>
                </tr>

                ${links.map(link => `
                    <tr>
                        <td>
                            ${escapeHTML(link.text)}
                        </td>

                        <td>
                            ${escapeHTML(link.href)}
                        </td>
                    </tr>
                `).join("")}

            </table>

        </div>


        <div class="card">

            <h2>圖片</h2>

            <table>

                <tr>
                    <th>URL</th>
                    <th>Alt</th>
                </tr>

                ${images.map(image => `
                    <tr>
                        <td>
                            ${escapeHTML(image.src)}
                        </td>

                        <td>
                            ${escapeHTML(image.alt)}
                        </td>
                    </tr>
                `).join("")}

            </table>

        </div>


        <div class="card">

            <h2>JavaScript</h2>

            ${scripts.length
                ? scripts.map(s =>
                    `<p>${escapeHTML(s)}</p>`
                  ).join("")
                : "沒有找到"
            }

        </div>


        <div class="card">

            <h2>CSS</h2>

            ${styles.length
                ? styles.map(s =>
                    `<p>${escapeHTML(s)}</p>`
                  ).join("")
                : "沒有找到"
            }

        </div>


        <div class="card">

            <h2>HTML 原始碼</h2>

            <pre>${escapeHTML(html)}</pre>

        </div>

        `;

    } catch (error) {

        result.innerHTML = `
            <div class="card error">

                無法取得這個網站。

                <br><br>

                可能原因：
                <br>
                1. 網站禁止跨來源請求
                <br>
                2. 網站拒絕第三方 Proxy
                <br>
                3. 網站需要登入
                <br>
                4. 網址不存在
                <br>
                5. Proxy 暫時無法使用

            </div>
        `;
    }
}


function escapeHTML(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatBytes(bytes) {

    if (bytes < 1024) {
        return bytes + " Bytes";
    }

    if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(2) + " KB";
    }

    return (
        bytes / 1024 / 1024
    ).toFixed(2) + " MB";
}

</script>

</body>
</html>
