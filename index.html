<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網站壓力測試工具</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        input,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            font-size: 16px;
        }

        button {
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            white-space: pre-line;
        }
    </style>
</head>

<body>

    <h1>網站壓力測試工具</h1>

    <input
        id="url"
        type="url"
        placeholder="輸入你的網站，例如 https://example.com"
    >

    <input
        id="requests"
        type="number"
        value="10"
        min="1"
        max="100"
        placeholder="並發數"
    >

    <input
        id="duration"
        type="number"
        value="10"
        min="1"
        max="60"
        placeholder="測試秒數"
    >

    <button onclick="startTest()">
        開始測試
    </button>

    <div id="result">
        等待測試...
    </div>

    <script>
        async function testWebsite(url) {
            const start = performance.now();

            try {
                const response = await fetch(url, {
                    method: "GET",
                    mode: "no-cors",
                    cache: "no-store"
                });

                const end = performance.now();

                return {
                    success: true,
                    time: end - start
                };

            } catch (error) {
                const end = performance.now();

                return {
                    success: false,
                    time: end - start
                };
            }
        }

        async function startTest() {

            const url = document.getElementById("url").value;
            const concurrency =
                Number(document.getElementById("requests").value);

            const duration =
                Number(document.getElementById("duration").value);

            const resultBox =
                document.getElementById("result");

            if (!url) {
                resultBox.textContent = "請輸入網站網址。";
                return;
            }

            resultBox.textContent = "測試開始...\n";

            const startTime = Date.now();

            let total = 0;
            let success = 0;
            let failed = 0;
            let times = [];

            while (Date.now() - startTime < duration * 1000) {

                const tasks = [];

                for (let i = 0; i < concurrency; i++) {
                    tasks.push(testWebsite(url));
                }

                const results = await Promise.all(tasks);

                for (const result of results) {

                    total++;

                    times.push(result.time);

                    if (result.success) {
                        success++;
                    } else {
                        failed++;
                    }
                }

                resultBox.textContent =
                    `測試中...\n\n` +
                    `總訪問數：${total}\n` +
                    `成功：${success}\n` +
                    `失敗：${failed}`;
            }

            const elapsed =
                (Date.now() - startTime) / 1000;

            const average =
                times.length
                    ? times.reduce((a, b) => a + b, 0) / times.length
                    : 0;

            const fastest =
                times.length
                    ? Math.min(...times)
                    : 0;

            const slowest =
                times.length
                    ? Math.max(...times)
                    : 0;

            const rps =
                total / elapsed;

            const successRate =
                total
                    ? success / total * 100
                    : 0;

            resultBox.textContent =
                `========== 測試完成 ==========\n\n` +
                `測試網址：${url}\n` +
                `測試時間：${elapsed.toFixed(2)} 秒\n` +
                `並發數：${concurrency}\n\n` +

                `總訪問數：${total}\n` +
                `成功：${success}\n` +
                `失敗：${failed}\n` +
                `成功率：${successRate.toFixed(2)}%\n` +
                `平均 RPS：${rps.toFixed(2)}\n\n` +

                `平均回應時間：${average.toFixed(2)} ms\n` +
                `最快回應：${fastest.toFixed(2)} ms\n` +
                `最慢回應：${slowest.toFixed(2)} ms\n\n` +

                `===============================`;
        }
    </script>

</body>
</html>
