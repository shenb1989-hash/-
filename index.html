<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網站負載測試工具</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #f5f7fa;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

h2 {
    margin-top: 0;
}

input {
    width: 100%;
    padding: 12px;
    margin: 7px 0 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
}

button {
    padding: 12px 20px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    margin-right: 8px;
}

.start {
    background: #222;
    color: white;
}

.stop {
    background: #ddd;
}

.stats {
    margin-top: 20px;
    padding: 15px;
    background: #f5f5f5;
    border-radius: 10px;
    line-height: 1.8;
}

.progress {
    width: 100%;
    height: 12px;
    background: #ddd;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 15px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #333;
    transition: width .1s;
}

#status {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h2>網站負載測試工具</h2>

<label>測試網址</label>
<input
    id="url"
    type="url"
    placeholder="https://example.com"
>

<label>最大請求次數</label>
<input
    id="maxRequests"
    type="number"
    value="100"
    min="1"
>

<label>測試時間（秒）</label>
<input
    id="duration"
    type="number"
    value="10"
    min="1"
>

<button class="start" onclick="startTest()">
開始測試
</button>

<button class="stop" onclick="stopTest()">
停止測試
</button>

<div class="progress">
    <div id="progressBar" class="progress-bar"></div>
</div>

<div class="stats">
    <div>已發送：<span id="sent">0</span></div>
    <div>成功：<span id="success">0</span></div>
    <div>失敗：<span id="failed">0</span></div>
    <div>剩餘時間：<span id="remaining">0</span> 秒</div>
</div>

<div id="status">
    尚未開始
</div>

</div>

<script>
let running = false;
let sent = 0;
let success = 0;
let failed = 0;

async function startTest() {

    if (running) return;

    const url = document.getElementById("url").value.trim();
    const maxRequests =
        Number(document.getElementById("maxRequests").value);

    const duration =
        Number(document.getElementById("duration").value);

    if (!url) {
        alert("請輸入網址");
        return;
    }

    if (maxRequests <= 0 || duration <= 0) {
        alert("請輸入有效的數值");
        return;
    }

    running = true;

    sent = 0;
    success = 0;
    failed = 0;

    const startTime = Date.now();
    const endTime = startTime + duration * 1000;

    updateUI(duration);

    while (
        running &&
        sent < maxRequests &&
        Date.now() < endTime
    ) {

        try {

            const response = await fetch(url, {
                method: "GET",
                cache: "no-store"
            });

            sent++;

            if (response.ok) {
                success++;
            } else {
                failed++;
            }

        } catch (error) {

            sent++;
            failed++;

        }

        updateUI(
            Math.max(
                0,
                (endTime - Date.now()) / 1000
            )
        );
    }

    if (running) {
        running = false;
        document.getElementById("status").textContent =
            "測試完成";
    } else {
        document.getElementById("status").textContent =
            "測試已停止";
    }

    updateUI(0);
}

function stopTest() {

    if (!running) return;

    running = false;

    document.getElementById("status").textContent =
        "正在停止...";
}

function updateUI(remaining) {

    document.getElementById("sent").textContent =
        sent;

    document.getElementById("success").textContent =
        success;

    document.getElementById("failed").textContent =
        failed;

    document.getElementById("remaining").textContent =
        remaining.toFixed(1);

    const maxRequests =
        Number(document.getElementById("maxRequests").value);

    const progress =
        Math.min(100, (sent / maxRequests) * 100);

    document.getElementById("progressBar").style.width =
        progress + "%";

    document.getElementById("status").textContent =
        running ? "測試進行中..." : "測試已停止";
}
</script>

</body>
</html>
