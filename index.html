<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網站負載測試工具</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 14px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

label {
    display: block;
    margin-top: 12px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: 0;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

.status {
    text-align: center;
    font-weight: bold;
    margin: 15px 0;
}

.progress {
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.bar {
    height: 100%;
    width: 0%;
    background: #111;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
}

.stat {
    padding: 15px;
    background: #f1f3f5;
    border-radius: 10px;
}

.stat b {
    display: block;
    font-size: 22px;
    margin-top: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    text-align: center;
}

.warning {
    padding: 15px;
    background: #fff3cd;
    border-radius: 10px;
    margin-top: 15px;
}

.good {
    padding: 15px;
    background: #d1e7dd;
    border-radius: 10px;
    margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<h1>網站負載測試工具</h1>

<div class="card">

<label>測試網址</label>
<input id="url" value="https://ssjh.tc.edu.tw/">

<label>開始並發數</label>
<input id="start" type="number" value="5" min="1" max="50">

<label>每階段增加</label>
<input id="step" type="number" value="5" min="1" max="20">

<label>最高並發數</label>
<input id="max" type="number" value="50" min="1" max="100">

<label>每階段測試秒數</label>
<input id="seconds" type="number" value="5" min="1" max="30">

<button id="startBtn" onclick="startTest()">開始測試</button>

</div>

<div class="card">

<div class="status" id="status">尚未開始</div>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

</div>

<div class="card">

<h2>目前結果</h2>

<div class="grid">

<div class="stat">
總請求
<b id="total">0</b>
</div>

成功
