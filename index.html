<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>網站公開資訊檢測器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 30px 15px;
    background: #f5f7fa;
    font-family: Arial, sans-serif;
    color: #222;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

.input-box {
    display: flex;
    gap: 10px;
    margin: 20px 0;
}

input {
    flex: 1;
    padding: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

button {
    padding: 13px 20px;
    border: 0;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.85;
}

.card {
    background: white;
    padding: 20px;
    margin-top: 15px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
}

pre {
    white-space: pre-wrap;
    word-break: break-all;
    background: #f1f3f5;
    padding: 15px;
    border-radius: 8px;
    overflow-x: auto;
}

.item {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    word-break: break-all;
}

.error {
    color: #c62828;
}

.success {
    color: #2e7d32;
}
</style>
</head>

<body>

<div class="container">

<h1>網站公開資訊檢測器</h1>

<div class="input-box">
    <input
        id="url"
        type="url"
        placeholder="https://example.edu.tw"
    >
    <button onclick="scanWebsite()">開始檢測</button>
</div>

<div id="result"></div>

</div>

<script>
// 📌 核心修改：利用 AllOrigins 免費中繼代理伺服器繞過瀏覽器 CORS 阻擋
const CORS_PROXY = "https://allorigins.win";

async function fetchText(url) {
    // 將原本的網址打包塞到代理伺服器後面，由代理伺服器幫前端去抓網頁
    const response = await fetch(CORS_PROXY + encodeURIComponent(url), {
        method: "GET"
    });

    if (!response.ok) {
        throw new Error(`HTTP ${response.status} (透過代理伺服器失敗)`);
    }

    return {
        response,
        text: await response.text()
    };
}

function normalizeUrl(url) {
    url = url.trim();

    if (!/^https?:\/\//i.test(url)) {
        url = "https://" + url;
    }

    return new URL(url);
}

function extractLinks(document, baseUrl) {
    const links = [];

    document.querySelectorAll("a[href]").forEach(a => {
        try {
            const url = new URL(a.getAttribute("href"), baseUrl);

            if (!links.includes(url.href)) {
                links.push(url.href);
            }
        } catch {}
    });

    return links;
}

function extractScripts(document, baseUrl) {
    const scripts = [];

    document.querySelectorAll("script[src]").forEach(script => {
        try {
            const url = new URL(
                script.getAttribute("src"),
                baseUrl
            );

            if (!scripts.includes(url.href)) {
                scripts.push(url.href);
            }
        } catch {}
    });

    return scripts;
}

function extractPublicEndpoints(text) {
    const endpoints = new Set();

    const patterns = [
        /https?:\/\/[^\s"'<>]+/gi,
        /\/api\/[A-Za-z0-9_?&=./%-]+/gi,
        /\/graphql(?:\/[A-Za-z0-9_?&=./%-]*)?/gi,
        /\/v[0-9]+\/[A-Za-z0-9_?&=./%-]+/gi
    ];

    for (const pattern of patterns) {
        const matches = text.match(pattern) || [];

        matches.forEach(match => {
            endpoints.add(match);
        });
    }

    return [...endpoints];
}

function renderList(items) {
    if (!items.length) {
        return "<div>沒有找到公開項目</div>";
    }

    return items
        .map(item => `<div class="item">${escapeHtml(item)}</div>`)
        .join("");
}

function escapeHtml(value) {
    return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "'");
}

async function scanWebsite() {

    const result = document.getElementById("result");
    const input = document.getElementById("url").value;

    if (!input) {
        result.innerHTML = `
            <div class="card error">
                請輸入網站 URL
            </div>
        `;
        return;
    }

    let target;

    try {
        target = normalizeUrl(input);
    } catch {
        result.innerHTML = `
            <div class="card error">
                URL 格式錯誤
            </div>
        `;
        return;
    }

    result.innerHTML = `
        <div class="card">
            正在檢測（透過中繼代理）：<br>
            <strong>${escapeHtml(target.href)}</strong>
        </div>
    `;

    try {

        const { response, text } = await fetchText(target.href);

        const parser = new DOMParser();
        const document = parser.parseFromString(
            text,
            "text/html"
        );

        const links = extractLinks(
            document,
            target.href
        );

        const scripts = extractScripts(
            document,
            target.href
        );

        const endpoints = extractPublicEndpoints(text);

        const robotsUrl =
            new URL("/robots.txt", target.origin).href;

        const sitemapUrl =
            new URL("/sitemap.xml", target.origin).href;

        let robotsStatus = "無法讀取";

        try {
            // 📌 修正點：robots.txt 請求同樣需要透過 Proxy 繞過 CORS
            const robotsResponse =
                await fetch(CORS_PROXY + encodeURIComponent(robotsUrl));

            robotsStatus =
                robotsResponse.ok ? `HTTP ${robotsResponse.status} (讀取成功)` : `HTTP ${robotsResponse.status}`;
        } catch {}

        let sitemapStatus = "無法讀取";

        try {
            // 📌 修正點：sitemap.xml 請求同樣需要透過 Proxy 繞過 CORS
            const sitemapResponse =
                await fetch(CORS_PROXY + encodeURIComponent(sitemapUrl));

            sitemapStatus =
                sitemapResponse.ok ? `HTTP ${sitemapResponse.status} (讀取成功)` : `HTTP ${sitemapResponse.status}`;
        } catch {}

        result.innerHTML = `

            <div class="card">
                <h2>基本資訊</h2>

                <div class="item">
                    輸入 URL：
                    ${escapeHtml(input)}
                </div>

                <div class="item">
                    標準化 URL：
                    ${escapeHtml(target.href)}
                </div>

                <div class="item">
                    Origin：
                    ${escapeHtml(target.origin)}
                </div>

                <div class="item">
                    HTTP Status：
                    ${response.status}
                </div>
            </div>

            <div class="card">
                <h2>robots.txt</h2>

                <div class="item">
                    ${escapeHtml(robotsUrl)}
                </div>

                <div class="item">
                    ${escapeHtml(robotsStatus)}
                </div>
            </div>

            <div class="card">
                <h2>sitemap.xml</h2>

                <div class="item">
                    ${escapeHtml(sitemapUrl)}
                </div>

                <div class="item">
                    ${escapeHtml(sitemapStatus)}
                </div>
            </div>

            <div class="card">
                <h2>公開頁面連結 (${links.length})</h2>

                ${renderList(links)}
            </div>

            <div class="card">
                <h2>公開 JavaScript (${scripts.length})</h2>

                ${renderList(scripts)}
            </div>

            <div class="card">
                <h2>疑似公開 Endpoint (${endpoints.length})</h2>

                ${renderList(endpoints)}
            </div>

        `;

    } catch (error) {

        result.innerHTML = `
            <div class="card error">
                <h2>檢測失敗</h2>

                <p>
                    ${escapeHtml(error.message)}
                </p>

                <p>
                    常見原因：目標網站完全封鎖了該代理伺服器的 IP、無網路連線，或網址輸入錯誤。
                </p>
            </div>
        `;
    }
}
</script>

</body>
</html>
