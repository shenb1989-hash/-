
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webhook 訊息發送器</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px;
    min-height: 100vh;
    background: #0b1020;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 520px;
    background: #151e32;
    padding: 28px;
    border-radius: 18px;
    border: 1px solid #293750;
}

h2 {
    margin-top: 0;
    text-align: center;
}

.description {
    color: #9ba9c0;
    text-align: center;
    font-size: 13px;
    margin-bottom: 25px;
}

label {
    display: block;
    margin: 15px 0 8px;
    color: #cbd5e1;
    font-size: 14px;
}

input, textarea {
    width: 100%;
    padding: 13px;
    border-radius: 9px;
    border: 1px solid #34435d;
    background: #0d1628;
    color: white;
    outline: none;
    font-size: 14px;
}

textarea {
    height: 150px;
    resize: vertical;
}

input:focus, textarea:focus {
    border-color: #648cff;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    border: none;
    border-radius: 9px;
    background: #5865f2;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.clear {
    background: #293750;
}

#status {
    margin-top: 18px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-size: 13px;
    display: none;
}
</style>
</head>

<body>

<div class="container">

    <h2>Webhook 訊息發送器</h2>

    <div class="description">
        輸入訊息，直接發送至指定的群組聊天室
    </div>

    <label for="webhook">Webhook URL</label>
    <input
        type="password"
        id="webhook"
        placeholder="貼上你的 Discord Webhook"
        autocomplete="off"
    >

    <label for="message">訊息內容</label>
    <textarea
        id="message"
        placeholder="輸入你想發送的訊息..."
    ></textarea>

    <button id="sendBtn" onclick="sendMessage()">
        發送訊息
    </button>

    <button class="clear" onclick="clearMessage()">
        清空內容
    </button>

    <div id="status"></div>

</div>

<script>
const webhookInput = document.getElementById("webhook");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");

// 載入上次使用的 Webhook
webhookInput.value = sessionStorage.getItem("webhook") || "";

function showStatus(message, success) {
    statusBox.style.display = "block";
    statusBox.textContent = message;
    statusBox.style.background = success ? "#123b2b" : "#472323";
    statusBox.style.color = success ? "#72e6a7" : "#ff9999";
}

async function sendMessage() {
    const webhook = webhookInput.value.trim();
    const message = messageInput.value.trim();

    if (!webhook || !message) {
        showStatus("請輸入 Webhook URL 和訊息內容", false);
        return;
    }

    try {
        const url = new URL(webhook);

        if (
            url.protocol !== "https:" ||
            url.hostname !== "discord.com" ||
            !/^\/api\/webhooks\/\d+\/[^/]+\/?$/.test(url.pathname)
        ) {
            showStatus("Webhook URL 格式不正確", false);
            return;
        }
    } catch {
        showStatus("Webhook URL 格式不正確", false);
        return;
    }

    sendBtn.disabled = true;
    sendBtn.textContent = "發送中...";

    try {
        const response = await fetch(webhook, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                content: message
            })
        });

        if (!response.ok) {
            throw new Error("HTTP " + response.status);
        }

        sessionStorage.setItem("webhook", webhook);

        showStatus("訊息發送成功！", true);
        messageInput.value = "";

    } catch (error) {
        showStatus(
            "發送失敗：" + error.message +
            "，請檢查網路或 Webhook 設定。",
            false
        );
    } finally {
        sendBtn.disabled = false;
        sendBtn.textContent = "發送訊息";
    }
}

function clearMessage() {
    messageInput.value = "";
    statusBox.style.display = "none";
}
</script>

</body>
</html>
